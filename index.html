<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#022c22" />
<title>Nur al-Quran · النور — Premium Quran Recitation</title>
<meta name="description" content="A premium, elegant Quran reading and recitation web app with Arabic text, translations, and beautiful audio recitation." />

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@300;400;500;600&display=swap" rel="stylesheet" />

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          emerald: {
            950: '#022c22',
            900: '#064e3b',
          },
          gold: {
            DEFAULT: '#d97706',
            dark: '#b45309',
            light: '#f59e0b',
          },
          cream: '#faf8f3',
          obsidian: '#0a0f0d',
          slate950: '#0f172a',
        },
        fontFamily: {
          arabic: ["'Amiri'", 'serif'],
          quran: ["'Scheherazade New'", 'serif'],
          sans: ["'Plus Jakarta Sans'", 'sans-serif'],
          bengali: ["'Hind Siliguri'", 'sans-serif'],
        },
        boxShadow: {
          premium: '0 10px 40px -10px rgba(4, 78, 59, 0.25)',
          gold: '0 8px 30px -8px rgba(217, 119, 6, 0.35)',
        },
        animation: {
          'fade-in': 'fadeIn 0.8s ease forwards',
          'fade-up': 'fadeUp 0.7s ease forwards',
          'slide-up': 'slideUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards',
          'shimmer': 'shimmer 1.6s infinite linear',
          'pulse-ring': 'pulseRing 2s ease infinite',
          'spin-slow': 'spin 18s linear infinite',
        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          fadeUp: { '0%': { opacity: 0, transform: 'translateY(24px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          slideUp: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } },
          shimmer: { '0%': { backgroundPosition: '-500px 0' }, '100%': { backgroundPosition: '500px 0' } },
          pulseRing: { '0%': { transform: 'scale(0.9)', opacity: 0.7 }, '70%': { transform: 'scale(1.3)', opacity: 0 }, '100%': { opacity: 0 } },
        },
      },
    },
  };
</script>

<style>
  :root { --gold: #d97706; --emerald: #064e3b; }

  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .font-arabic-text { font-family: 'Scheherazade New', serif; line-height: 2.4; }
  .bengali { font-family: 'Hind Siliguri', sans-serif; }

  /* Light background with subtle Islamic pattern */
  .app-bg-light {
    background-color: #faf8f3;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(217,119,6,0.05), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(6,78,59,0.06), transparent 40%);
  }
  .app-bg-dark {
    background-color: #0a0f0d;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(217,119,6,0.08), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(6,78,59,0.25), transparent 45%);
  }

  /* Glassmorphism */
  .glass {
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  /* Gold gradient text */
  .text-gradient-gold {
    background: linear-gradient(135deg, #f59e0b, #d97706, #b45309);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 10px; opacity: 0.6; }
  ::-webkit-scrollbar-thumb:hover { background: #b45309; }

  /* Skeleton shimmer */
  .skeleton {
    background: linear-gradient(90deg, rgba(0,0,0,0.06) 25%, rgba(0,0,0,0.12) 37%, rgba(0,0,0,0.06) 63%);
    background-size: 800px 100%;
    animation: shimmer 1.6s infinite linear;
  }
  .dark .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 37%, rgba(255,255,255,0.05) 63%);
    background-size: 800px 100%;
  }

  /* Octagon / Islamic geometric number badge */
  .octagon {
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
  }

  /* Range slider (audio + speed) */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 999px; cursor: pointer;
    background: rgba(217,119,6,0.25);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #d97706; border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(217,119,6,0.5);
    transition: transform 0.15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #d97706; border: 2px solid #fff; cursor: pointer;
  }

  /* Toggle switch */
  .toggle-track { transition: background 0.3s ease; }
  .toggle-thumb { transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); }

  /* Card hover lift */
  .surah-card { transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease, border-color 0.35s ease; }
  .surah-card:hover { transform: translateY(-6px); }

  /* Verse fade stagger */
  .verse-item { opacity: 0; animation: fadeUp 0.5s ease forwards; }

  /* Playing verse highlight */
  .verse-playing {
    background: linear-gradient(90deg, rgba(217,119,6,0.12), rgba(217,119,6,0.02));
    border-color: rgba(217,119,6,0.5) !important;
  }

  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* smooth view transition */
  .view { animation: fadeIn 0.4s ease; }
</style>
</head>

<script>
/* ============================================================
   Nur al-Quran — App Logic (Vanilla JS)
   API: alquran.cloud + islamic.network CDN
============================================================ */

const API = 'https://api.alquran.cloud/v1';
const AUDIO_CDN = 'https://cdn.islamic.network/quran/audio-surah/128';

const EDITIONS = {
  arabic: 'quran-uthmani',
  english: 'en.sahih',
  bengali: 'bn.bengali',
};

const RECITERS = [
  { id: 'ar.alafasy', name: 'Mishary Alafasy' },
  { id: 'ar.abdulbasitmurattal', name: 'Abdul Basit (Murattal)' },
  { id: 'ar.sudais', name: 'Abdurrahman As-Sudais' },
  { id: 'ar.husary', name: 'Mahmoud Al-Husary' },
  { id: 'ar.minshawi', name: 'Al-Minshawi' },
  { id: 'ar.shaatree', name: 'Abu Bakr Ash-Shaatree' },
  { id: 'ar.hudhaify', name: 'Ali Al-Hudhaify' },
];

const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];

// ---------- State ----------
const state = {
  surahs: [],
  filtered: [],
  layout: 'grid',
  currentSurah: null,      // {number, ...}
  reciter: 'ar.alafasy',
  speedIndex: 0,
  isPlaying: false,
};

// ---------- Elements ----------
const $ = (id) => document.getElementById(id);
const audio = $('audio');

/* ================= THEME ================= */
(function initTheme(){
  const saved = localStorage.getItem('nur-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
  updateBg();
})();
function updateBg(){
  const dark = document.documentElement.classList.contains('dark');
  document.body.classList.toggle('app-bg-dark', dark);
  document.body.classList.toggle('app-bg-light', !dark);
}
$('themeToggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('nur-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  updateBg();
});

/* ================= TOAST ================= */
let toastTimer;
function toast(msg){
  $('toastMsg').textContent = msg;
  $('toast').style.transform = 'translate(-50%, 0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').style.transform = 'translate(-50%,-140%)', 3200);
}

/* ================= HELPERS ================= */
function fmtTime(s){
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
async function fetchJSON(url, tries = 2){
  for (let i=0;i<tries;i++){
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      if (j.code !== 200) throw new Error('API '+j.code);
      return j.data;
    } catch(e){
      if (i === tries-1) throw e;
      await new Promise(res => setTimeout(res, 700));
    }
  }
}

/* ================= HERO — Ayah of the Day ================= */
async function loadAyahOfDay(){
  // Deterministic "of the day" so it's stable within a day, plus variety across days
  const dayNum = Math.floor(Date.now() / 8.64e7);
  const ayahNo = (dayNum * 37) % 6236 + 1;
  try {
    const data = await fetchJSON(`${API}/ayah/${ayahNo}/editions/${EDITIONS.arabic},${EDITIONS.english}`);
    const ar = data[0], en = data[1];
    $('hero').innerHTML = `
      <p dir="rtl" class="font-arabic-text text-2xl sm:text-3xl md:text-4xl text-white leading-loose mb-5 opacity-0 animate-fade-up" style="animation-delay:.1s">${ar.text}</p>
      <p class="text-gold-light/90 text-sm sm:text-base italic max-w-2xl opacity-0 animate-fade-up" style="animation-delay:.3s">"${en.text}"</p>
      <div class="mt-5 flex items-center gap-3 opacity-0 animate-fade-up" style="animation-delay:.5s">
        <span class="w-8 h-px bg-gold/50"></span>
        <span class="text-gold text-sm font-semibold">${ar.surah.englishName} · ${ar.surah.number}:${ar.numberInSurah}</span>
      </div>`;
  } catch(e){
    $('hero').innerHTML = `<p class="text-gold-light/80">Could not load the Ayah of the Day. <button onclick="loadAyahOfDay()" class="underline">Retry</button></p>`;
  }
}

/* ================= SURAH LIST ================= */
function surahSkeletons(n = 9){
  let h = '';
  for (let i=0;i<n;i++){
    h += `<div class="rounded-2xl p-5 border border-gold/15 bg-white/50 dark:bg-white/5">
      <div class="flex items-center gap-4">
        <div class="skeleton w-14 h-14 rounded-xl"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-4 w-2/3 rounded"></div>
          <div class="skeleton h-3 w-1/3 rounded"></div>
        </div>
      </div></div>`;
  }
  $('surahList').innerHTML = h;
}

async function loadSurahs(){
  surahSkeletons();
  try {
    const data = await fetchJSON(`${API}/surah`);
    state.surahs = data;
    state.filtered = data;
    renderSurahs();
  } catch(e){
    $('surahList').innerHTML = `
      <div class="col-span-full text-center py-16">
        <i class="fa-solid fa-triangle-exclamation text-4xl text-gold mb-3"></i>
        <p class="text-slate-500 dark:text-slate-400 mb-4">Failed to load Surahs. Please check your connection.</p>
        <button onclick="loadSurahs()" class="px-5 py-2.5 rounded-full bg-gold text-white text-sm font-semibold hover:bg-gold-dark transition">Try Again</button>
      </div>`;
  }
}

function revelationBadge(type){
  const meccan = type.toLowerCase() === 'meccan';
  return `<span class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full ${meccan ? 'bg-amber-500/15 text-amber-600 dark:text-amber-400' : 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'}">
    <i class="fa-solid ${meccan ? 'fa-kaaba' : 'fa-mosque'} text-[10px]"></i>${meccan ? 'Meccan' : 'Medinan'}
  </span>`;
}

function renderSurahs(){
  const grid = state.layout === 'grid';
  const list = $('surahList');
  list.className = grid
    ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4'
    : 'grid grid-cols-1 gap-3';

  if (!state.filtered.length){ $('emptyState').classList.remove('hidden'); list.innerHTML=''; return; }
  $('emptyState').classList.add('hidden');

  list.innerHTML = state.filtered.map((s, i) => `
    <button data-num="${s.number}" style="animation-delay:${Math.min(i*30,600)}ms"
      class="surah-card group text-left rounded-2xl p-5 border border-gold/15 dark:border-gold/10 bg-white/60 dark:bg-white/[0.04] hover:border-gold/50 hover:shadow-gold glass animate-fade-up opacity-0">
      <div class="flex items-center gap-4">
        <div class="relative shrink-0">
          <div class="octagon w-14 h-14 bg-gradient-to-br from-emerald-900 to-emerald-950 grid place-items-center border border-gold/30 group-hover:from-gold group-hover:to-gold-dark transition-all duration-500">
            <span class="font-bold text-gold group-hover:text-white transition-colors">${s.number}</span>
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <h3 class="font-bold text-emerald-900 dark:text-white truncate">${s.englishName}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${s.englishNameTranslation}</p>
            </div>
            <span class="font-arabic text-xl text-gold-dark dark:text-gold shrink-0">${s.name}</span>
          </div>
          <div class="flex items-center gap-2 mt-3 flex-wrap">
            ${revelationBadge(s.revelationType)}
            <span class="text-[11px] text-slate-400 dark:text-slate-500 flex items-center gap-1">
              <i class="fa-solid fa-layer-group text-[10px]"></i>${s.numberOfAyahs} Ayahs
            </span>
          </div>
        </div>
      </div>
    </button>`).join('');

  list.querySelectorAll('[data-num]').forEach(btn =>
    btn.addEventListener('click', () => openSurah(+btn.dataset.num)));
}

/* ================= SEARCH ================= */
let searchTimer;
$('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = e.target.value.trim().toLowerCase();
    state.filtered = !q ? state.surahs : state.surahs.filter(s =>
      s.englishName.toLowerCase().includes(q) ||
      s.englishNameTranslation.toLowerCase().includes(q) ||
      s.name.includes(q) ||
      String(s.number) === q);
    renderSurahs();
  }, 200);
});

/* ================= LAYOUT TOGGLE ================= */
document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.layout = btn.dataset.layout;
    document.querySelectorAll('.layout-btn').forEach(b => {
      const active = b.dataset.layout === state.layout;
      b.classList.toggle('bg-gold/10', active);
      b.classList.toggle('text-gold-dark', active);
      b.classList.toggle('dark:text-gold', active);
      b.classList.toggle('text-slate-500', !active);
    });
    renderSurahs();
  });
});

/* ================= SURAH DETAIL ================= */
function verseSkeletons(n=6){
  let h='';
  for(let i=0;i<n;i++) h+=`<div class="rounded-2xl p-6 border border-gold/15 bg-white/50 dark:bg-white/5 space-y-3">
    <div class="skeleton h-8 w-full rounded"></div>
    <div class="skeleton h-4 w-3/4 rounded"></div>
    <div class="skeleton h-4 w-2/3 rounded"></div></div>`;
  $('verseContainer').innerHTML = h;
}

async function openSurah(num){
  const meta = state.surahs.find(s => s.number === num);
  state.currentSurah = meta;

  // Switch views
  $('listView').classList.add('hidden');
  $('detailView').classList.remove('hidden');
  $('detailView').classList.remove('view'); void $('detailView').offsetWidth; $('detailView').classList.add('view');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('detailHeader').innerHTML = `
    <div class="octagon w-16 h-16 mx-auto bg-white/10 border border-gold/30 grid place-items-center mb-4">
      <span class="font-bold text-gold text-xl">${meta.number}</span>
    </div>
    <h2 class="font-arabic text-4xl sm:text-5xl text-white mb-2">${meta.name}</h2>
    <p class="text-gold text-lg font-semibold">${meta.englishName}</p>
    <p class="text-gold-light/70 text-sm mb-4">${meta.englishNameTranslation}</p>
    <div class="flex items-center justify-center gap-3 flex-wrap">
      ${revelationBadge(meta.revelationType)}
      <span class="text-xs text-white/70 flex items-center gap-1"><i class="fa-solid fa-layer-group"></i>${meta.numberOfAyahs} Ayahs</span>
    </div>
    <button id="playFullBtn" class="mt-6 inline-flex items-center gap-2 px-6 py-3 rounded-full bg-gradient-to-r from-gold-light to-gold-dark text-white font-semibold shadow-gold hover:scale-105 active:scale-95 transition">
      <i class="fa-solid fa-play"></i> Play Full Surah
    </button>`;

  $('playFullBtn').addEventListener('click', () => playSurah(meta));

  verseSkeletons();

  try {
    const data = await fetchJSON(`${API}/surah/${num}/editions/${EDITIONS.arabic},${EDITIONS.english},${EDITIONS.bengali}`);
    const [ar, en, bn] = data;
    renderVerses(meta, ar.ayahs, en.ayahs, bn.ayahs);
  } catch(e){
    $('verseContainer').innerHTML = `
      <div class="text-center py-16">
        <i class="fa-solid fa-triangle-exclamation text-4xl text-gold mb-3"></i>
        <p class="text-slate-500 dark:text-slate-400 mb-4">Could not load verses.</p>
        <button onclick="openSurah(${num})" class="px-5 py-2.5 rounded-full bg-gold text-white text-sm font-semibold hover:bg-gold-dark transition">Retry</button>
      </div>`;
  }
}

function renderVerses(meta, ar, en, bn){
  // Bismillah for all except Surah 9 (At-Tawbah); Al-Fatiha (1) already includes it as ayah 1
  let bism = '';
  if (meta.number !== 9 && meta.number !== 1){
    bism = `<div class="text-center py-6 opacity-0 animate-fade-up">
      <p class="font-arabic-text text-3xl sm:text-4xl text-emerald-900 dark:text-gold">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
    </div>`;
  }

  $('verseContainer').innerHTML = bism + ar.map((a, i) => `
    <div class="verse-item rounded-2xl p-5 sm:p-6 border border-gold/15 dark:border-gold/10 bg-white/60 dark:bg-white/[0.04] glass"
         data-ayah="${a.numberInSurah}" style="animation-delay:${Math.min(i*40,800)}ms">
      <div class="flex items-center justify-between mb-4">
        <div class="octagon w-9 h-9 bg-gradient-to-br from-emerald-900 to-emerald-950 grid place-items-center border border-gold/30 shrink-0">
          <span class="text-xs font-bold text-gold">${a.numberInSurah}</span>
        </div>
        <button class="verse-play w-9 h-9 rounded-full grid place-items-center text-gold-dark dark:text-gold hover:bg-gold/10 transition"
          data-ayahnum="${a.number}" title="Play verse">
          <i class="fa-solid fa-play text-xs"></i>
        </button>
      </div>
      <p dir="rtl" class="font-arabic-text text-2xl sm:text-3xl text-slate-800 dark:text-slate-100 leading-loose mb-4">${a.text}</p>
      <p class="text-sm text-slate-600 dark:text-slate-300 mb-2 leading-relaxed">
        <span class="text-gold-dark dark:text-gold font-semibold">EN · </span>${en[i]?.text || ''}</p>
      <p class="bengali text-base text-slate-600 dark:text-slate-300 leading-relaxed">
        <span class="text-gold-dark dark:text-gold font-semibold bengali">বাংলা · </span>${bn[i]?.text || ''}</p>
    </div>`).join('');

  // Verse-level audio
  $('verseContainer').querySelectorAll('.verse-play').forEach(btn => {
    btn.addEventListener('click', () => playAyah(+btn.dataset.ayahnum, meta));
  });
}

$('backBtn').addEventListener('click', showList);
$('logoBtn').addEventListener('click', showList);
function showList(){
  $('detailView').classList.add('hidden');
  $('listView').classList.remove('hidden');
  $('listView').classList.remove('view'); void $('listView').offsetWidth; $('listView').classList.add('view');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= AUDIO PLAYER ================= */
function showPlayer(){ $('player').style.transform = 'translateY(0)'; }

function playSurah(meta){
  const src = `${AUDIO_CDN}/${state.reciter}/${meta.number}.mp3`;
  audio.src = src;
  $('playerTitle').textContent = `${meta.englishName} — Full Surah`;
  $('playerSub').textContent = `${reciterName()} · ${meta.numberOfAyahs} Ayahs`;
  $('playingIcon').className = 'fa-solid fa-book-quran text-gold';
  clearVersePlayingHighlight();
  play();
  showPlayer();
}

async function playAyah(globalAyahNumber, meta){
  const src = `https://cdn.islamic.network/quran/audio/128/${state.reciter}/${globalAyahNumber}.mp3`;
  audio.src = src;
  $('playerTitle').textContent = `${meta.englishName} — Verse`;
  $('playerSub').textContent = reciterName();
  $('playingIcon').className = 'fa-solid fa-comment-dots text-gold';
  play();
  showPlayer();
}

function reciterName(){ return (RECITERS.find(r => r.id === state.reciter) || {}).name || 'Reciter'; }

function play(){ audio.play().then(() => {}).catch(() => toast('Tap play to start audio')); }

$('playBtn').addEventListener('click', togglePlay);
function togglePlay(){
  if (!audio.src){ toast('Select a Surah to play first'); return; }
  if (audio.paused) audio.play(); else audio.pause();
}

audio.addEventListener('play', () => { state.isPlaying=true; $('playIcon').className='fa-solid fa-pause text-lg'; });
audio.addEventListener('pause', () => { state.isPlaying=false; $('playIcon').className='fa-solid fa-play text-lg ml-0.5'; });
audio.addEventListener('waiting', () => $('playIcon').className='fa-solid fa-spinner fa-spin text-lg');
audio.addEventListener('playing', () => $('playIcon').className='fa-solid fa-pause text-lg');
audio.addEventListener('error', () => { if(audio.src) toast('Audio unavailable for this selection'); });

// Progress
audio.addEventListener('timeupdate', () => {
  if (audio.duration){
    $('seekBar').value = (audio.currentTime / audio.duration) * 100;
    $('curTime').textContent = fmtTime(audio.currentTime);
    const pct = (audio.currentTime/audio.duration)*100;
    $('seekBar').style.background = `linear-gradient(90deg, #d97706 ${pct}%, rgba(217,119,6,0.25) ${pct}%)`;
  }
});
audio.addEventListener('loadedmetadata', () => $('durTime').textContent = fmtTime(audio.duration));
audio.addEventListener('ended', () => { if(state.currentSurah) nextSurah(); });

$('seekBar').addEventListener('input', (e) => {
  if (audio.duration) audio.currentTime = (e.target.value/100) * audio.duration;
});

// Prev / Next (navigate surahs)
$('prevBtn').addEventListener('click', prevSurah);
$('nextBtn').addEventListener('click', nextSurah);
function nextSurah(){
  if(!state.currentSurah) return;
  const n = state.currentSurah.number < 114 ? state.currentSurah.number+1 : 1;
  const meta = state.surahs.find(s => s.number===n);
  state.currentSurah = meta;
  if(!$('detailView').classList.contains('hidden')) openSurah(n); else playSurah(meta);
}
function prevSurah(){
  if(!state.currentSurah) return;
  const n = state.currentSurah.number > 1 ? state.currentSurah.number-1 : 114;
  const meta = state.surahs.find(s => s.number===n);
  state.currentSurah = meta;
  if(!$('detailView').classList.contains('hidden')) openSurah(n); else playSurah(meta);
}

// Speed
function cycleSpeed(){
  state.speedIndex = (state.speedIndex+1) % SPEEDS.length;
  const sp = SPEEDS[state.speedIndex];
  audio.playbackRate = sp;
  $('speedBtn').textContent = sp+'x';
  $('speedBtnM').textContent = sp+'x';
}
$('speedBtn').addEventListener('click', cycleSpeed);
$('speedBtnM').addEventListener('click', cycleSpeed);

// Reciter select
function buildReciters(){
  const opts = RECITERS.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  $('reciterSelect').innerHTML = opts;
  $('reciterSelectM').innerHTML = opts;
}
function onReciterChange(val){
  state.reciter = val;
  $('reciterSelect').value = val; $('reciterSelectM').value = val;
  // Reload current full-surah audio if playing a surah
  if (state.currentSurah && audio.src.includes('audio-surah')){
    const wasPlaying = !audio.paused;
    const t = audio.currentTime;
    audio.src = `${AUDIO_CDN}/${state.reciter}/${state.currentSurah.number}.mp3`;
    audio.addEventListener('loadedmetadata', function once(){ audio.currentTime = Math.min(t, audio.duration||t); audio.removeEventListener('loadedmetadata', once); if(wasPlaying) audio.play(); });
    $('playerSub').textContent = `${reciterName()} · ${state.currentSurah.numberOfAyahs} Ayahs`;
  }
  toast('Reciter: '+reciterName());
}
$('reciterSelect').addEventListener('change', e => onReciterChange(e.target.value));
$('reciterSelectM').addEventListener('change', e => onReciterChange(e.target.value));

// Mobile options drawer
$('mobileOptBtn').addEventListener('click', () => $('mobileOpts').classList.toggle('hidden'));

function clearVersePlayingHighlight(){
  document.querySelectorAll('.verse-playing').forEach(el => el.classList.remove('verse-playing'));
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') nextSurah();
  if (e.code === 'ArrowLeft') prevSurah();
});

/* ================= INIT ================= */
function init(){
  buildReciters();
  loadAyahOfDay();
  loadSurahs();
}
init();
</script>
</body>
    </html>
