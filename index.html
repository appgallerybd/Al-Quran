<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>القرآن الكريم — আল-কুরআন লাক্সারি</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #050811;
            --bg-card: #0b1120;
            --bg-elevated: #131b2e;
            --accent-gold: #e2b665;
            --accent-emerald: #10b981;
            --text-primary: #f4efe2;
            --text-muted: #64748b;
            --border: #1e293b;
            --arabic-font: 'Amiri', serif;
            --bangla-font: 'Noto Sans Bengali', sans-serif;
            --ui-font: 'Inter', system-ui, sans-serif;
        }

        .light {
            --bg-deep: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --accent-gold: #b38426;
            --accent-emerald: #059669;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--ui-font);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            user-select: none;
        }

        .bangla-text { font-family: var(--bangla-font); }
        .arabic-text { font-family: var(--arabic-font); direction: rtl; }

        /* Custom High-Speed Smooth Scroller */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

        /* Premium Octagon Badge */
        .ayah-octagon {
            width: 40px;
            height: 40px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        /* High-Performance Text-Only Active Highlights */
        .active-text-arabic {
            color: var(--accent-gold) !important;
            text-shadow: 0 0 1px var(--accent-gold);
            transition: color 0.3s ease;
        }
        .active-text-bangla {
            color: var(--accent-gold) !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .active-octagon {
            border-color: var(--accent-gold) !important;
            color: var(--accent-gold) !important;
        }

        .shimmer {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.2s infinite linear;
        }
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Mobile Optimization Fixes */
        .safe-bottom-area { padding-bottom: calc(env(safe-area-inset-bottom) + 76px); }
        .touch-target { min-width: 44px; min-height: 44px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden antialiased">

    <header class="bg-[var(--bg-card)] border-b border-[var(--border)] px-4 py-3 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[var(--accent-gold)] to-amber-300 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-quran text-slate-900 text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-[var(--accent-gold)] arabic-text">القرآن الكريم</h1>
                <p class="text-[10px] text-[var(--text-muted)] bangla-text -mt-0.5 tracking-wide">আল-কুরআন লাক্সারি প্ল্যাটফর্ম</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleAppTheme()" class="touch-target rounded-xl bg-[var(--bg-elevated)] border border-[var(--border)] flex items-center justify-center text-[var(--accent-gold)] hover:scale-105 active:scale-95 transition cursor-pointer" id="themeIconBtn">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <aside id="surahSidebarPanel" class="bg-[var(--bg-card)] border-r border-[var(--border)] w-full md:w-[320px] flex flex-col absolute md:relative inset-y-0 left-0 z-40 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            <div class="p-4 border-b border-[var(--border)]">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-xs text-[var(--text-muted)]"></i>
                    <input type="text" id="sidebarSearchField" placeholder="সূরার নাম খুঁজুন (বাংলা / English)..." class="w-full pl-10 pr-4 py-2.5 bg-[var(--bg-deep)] border border-[var(--border)] rounded-xl text-xs text-[var(--text-primary)] focus:outline-none focus:border-[var(--accent-gold)] bangla-text" oninput="executeLiveSidebarSearch(this.value)">
                </div>
            </div>

            <div id="sidebarListWrapper" class="flex-1 overflow-y-auto p-3 space-y-2 pb-24 md:pb-4">
                <div class="shimmer h-14 rounded-xl w-full opacity-10"></div>
                <div class="shimmer h-14 rounded-xl w-full opacity-10"></div>
            </div>
        </aside>

        <div id="responsiveSidebarBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden md:hidden" onclick="closeResponsiveMobileSidebar()"></div>

        <main class="flex-1 flex flex-col overflow-hidden bg-[var(--bg-deep)]">
            
            <section class="bg-[var(--bg-card)] border-b border-[var(--border)] px-4 py-2.5 flex flex-wrap gap-3 items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <span class="text-[11px] text-[var(--text-muted)] font-medium bangla-text"><i class="fa-solid fa-microphone-lines text-[var(--accent-gold)] mr-1"></i> ক্বারী:</span>
                    <select id="reciterProfileSelector" class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-xs text-[var(--accent-gold)] font-medium focus:outline-none bangla-text cursor-pointer" onchange="switchAppReciterContext(this.value)">
                        <option value="ar.alafasy">মিশারি রাশিদ আল-আফাসি</option>
                        <option value="ar.abdurrahmaansudais">আব্দুর রহমান আস-সুদাইস</option>
                        <option value="ar.husary">মাহমুদ খলিল আল-হুসারি</option>
                        <option value="ar.minshawi">মুহাম্মদ সিদ্দিক আল-মিনশাওয়ি</option>
                        <option value="ar.muhammadayyoub">মুহাম্মদ আইয়ুব</option>
                    </select>
                </div>

                <div class="flex bg-[var(--bg-deep)] border border-[var(--border)] rounded-lg p-0.5 text-xs font-semibold">
                    <button id="modeTabAyah" onclick="changeAppReadingMode('ayah')" class="px-3 py-1.5 rounded-md bg-[var(--bg-card)] text-[var(--accent-gold)] transition bangla-text cursor-pointer">আয়াত মোড</button>
                    <button id="modeTabPage" onclick="changeAppReadingMode('page')" class="px-3 py-1.5 rounded-md text-[var(--text-muted)] transition bangla-text cursor-pointer">পেইজ মোড</button>
                </div>
            </section>

            <section id="coreWorkspaceContainer" class="flex-1 overflow-y-auto p-4 md:p-6 safe-bottom-area">
                <div class="flex flex-col items-center justify-center py-32 text-[var(--text-muted)]">
                    <i class="fa-solid fa-circle-notch animate-spin text-3xl text-[var(--accent-gold)] mb-4"></i>
                    <p class="text-xs bangla-text font-medium">কুরআনুল কারীম লোড হচ্ছে...</p>
                </div>
            </section>
        </main>
    </div>

    <footer class="bg-[var(--bg-card)] border-t border-[var(--border)] p-3 md:px-6 z-40 shadow-2xl shrink-0">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-3">
            
            <div class="w-full md:w-1/4 text-center md:text-left flex flex-col justify-center">
                <h4 id="footerMetaSurahTitle" class="text-sm font-bold text-[var(--accent-gold)] bangla-text">সূরার নাম</h4>
                <p id="footerMetaAyahIndicator" class="text-[10px] text-[var(--text-muted)] bangla-text font-medium mt-0.5">আয়াত রিডিং ট্র্যাকার</p>
            </div>

            <div class="flex-1 w-full flex flex-col items-center gap-1">
                <div class="flex items-center gap-6">
                    <button onclick="toggleSingleVerseLoopOption()" id="loopSingleVerseToggleBtn" class="text-[var(--text-muted)] hover:text-[var(--accent-gold)] transition text-xs flex flex-col items-center cursor-pointer touch-target" title="আয়াত লুপ">
                        <i class="fa-solid fa-arrows-spin text-base"></i>
                        <span class="text-[8px] font-bold -mt-0.5">Verse</span>
                    </button>
                    
                    <button onclick="playPreviousVerseTrack()" class="text-[var(--accent-gold)] text-base hover:scale-110 active:scale-95 transition cursor-pointer touch-target" title="আগের আয়াত">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    
                    <button onclick="handleMasterPlaybackTrigger()" id="globalPlayPauseFloatingBtn" class="w-12 h-12 rounded-full bg-gradient-to-tr from-[var(--accent-gold)] to-amber-400 text-slate-950 text-base flex items-center justify-center shadow-lg active:scale-90 hover:brightness-110 transition cursor-pointer" title="প্লে/পজ">
                        <i class="fa-solid fa-play pl-0.5"></i>
                    </button>
                    
                    <button onclick="playNextVerseTrack()" class="text-[var(--accent-gold)] text-base hover:scale-110 active:scale-95 transition cursor-pointer touch-target" title="পরের আয়াত">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>

                    <button onclick="toggleWholeSurahLoopOption()" id="loopWholeSurahToggleBtn" class="text-[var(--text-muted)] hover:text-[var(--accent-gold)] transition text-xs flex flex-col items-center cursor-pointer touch-target" title="সূরা লুপ">
                        <i class="fa-solid fa-rotate text-base"></i>
                        <span class="text-[8px] font-bold -mt-0.5">Surah</span>
                    </button>
                </div>

                <div class="w-full flex items-center gap-2.5 text-[10px] text-[var(--text-muted)] font-mono">
                    <span id="playerTimerCurrentTime">00:00</span>
                    <input type="range" id="playerTimelineProgressSlider" value="0" min="0" max="100" class="flex-1 h-1 bg-[var(--bg-deep)] rounded-lg appearance-none cursor-pointer accent-[var(--accent-emerald)]" oninput="seekActiveAudioTimeline(this.value)">
                    <span id="playerTimerTotalDuration">00:00</span>
                </div>
            </div>

            <div class="hidden md:flex w-full md:w-1/4 items-center justify-end gap-4 text-xs">
                <div class="flex items-center gap-1.5 bg-[var(--bg-deep)] border border-[var(--border)] px-2 py-1 rounded-lg">
                    <i class="fa-solid fa-gauge-high text-[var(--text-muted)] text-[10px]"></i>
                    <select id="playerPlaybackSpeedMenu" onchange="adjustAudioPlaybackVelocity(this.value)" class="bg-transparent border-none font-medium text-[var(--text-muted)] text-[10px] focus:outline-none cursor-pointer">
                        <option value="0.75">0.75x</option>
                        <option value="1.0" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <button onclick="toggleAudioMuteState()" id="playerVolumeIconBadge" class="text-[var(--text-muted)] hover:text-[var(--accent-gold)] transition cursor-pointer">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" id="playerVolumeControlSlider" min="0" max="1" step="0.1" value="1" class="w-16 h-1 accent-[var(--accent-gold)] bg-[var(--bg-deep)] rounded-lg appearance-none cursor-pointer" oninput="changeAppVolumeIntensity(this.value)">
                </div>
            </div>

        </div>
    </footer>

    <nav class="md:hidden fixed bottom-0 inset-x-0 bg-[var(--bg-card)]/95 backdrop-blur-md border-t border-[var(--border)] h-16 flex items-center justify-around px-2 z-50 shadow-xl pb-safe">
        <button onclick="openResponsiveMobileSidebarTab()" id="tabItemSurah" class="flex flex-col items-center text-[var(--accent-gold)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-list-ul text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">সূরাসমূহ</span>
        </button>
        <button onclick="navigateToReaderMainDashboard()" id="tabItemRead" class="flex flex-col items-center text-[var(--text-muted)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-book-open text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">তিলাওয়াত</span>
        </button>
        <button onclick="loadUserBookmarksDashboardPage()" id="tabItemBookmark" class="flex flex-col items-center text-[var(--text-muted)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-bookmark text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">বुकমার্ক</span>
        </button>
        <button onclick="loadAppSettingsViewDashboardPage()" id="tabItemSettings" class="flex flex-col items-center text-[var(--text-muted)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-sliders text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">সেটিংস</span>
        </button>
    </nav>

    <audio id="nativeAudioPlayerEngine" preload="auto"></audio>

    <script>
        const AppState = {
            surahCacheIndexList: [],
            currentSurahContextObj: null,
            currentAyahActiveIndex: 0,
            activeReciterIdString: 'ar.alafasy',
            isPlaying: false,
            isLoopingSingleVerse: false,
            isLoopingWholeSurah: false,
            globalVolumeLevel: 1.0,
            playbackRateSpeedVelocity: 1.0,
            userSavedBookmarksList: [],
            darkModeEnabled: true,
            displayReadingMode: 'ayah', 
            activeNavigationTab: 'read',
            searchFilterQueryString: '',
            arabicPhraseTextFontSize: '2.4rem'
        };

        const coreAudioPlayer = document.getElementById('nativeAudioPlayerEngine');
        const API_ENDPOINT_URL_ROOT = 'https://api.alquran.cloud/v1';

        window.addEventListener('DOMContentLoaded', async () => {
            loadLocalSettingsPersistenceStorageData();
            setupCoreAudioEngineStateListeners();
            syncAppThemeInterfaceDisplay();
            
            await downloadSurahIndexCatalog();
            
            const lastPositionRecord = JSON.parse(localStorage.getItem('quran_last_position')) || { surah: 1, ayahIndex: 0 };
            await fetchAndLoadSurahDataPackage(lastPositionRecord.surah, lastPositionRecord.ayahIndex);
            
            switchMobileActiveTabIndicatorState('read');
        });

        function loadLocalSettingsPersistenceStorageData() {
            AppState.userSavedBookmarksList = JSON.parse(localStorage.getItem('quran_bookmarks')) || [];
            AppState.activeReciterIdString = localStorage.getItem('quran_reciter') || 'ar.alafasy';
            document.getElementById('reciterProfileSelector').value = AppState.activeReciterIdString;
            AppState.darkModeEnabled = localStorage.getItem('quran_theme') !== 'light';
            AppState.arabicPhraseTextFontSize = localStorage.getItem('quran_font_size') || '2.4rem';
        }

        function syncAppThemeInterfaceDisplay() {
            const iconBtnNode = document.getElementById('themeIconBtn');
            if(AppState.darkModeEnabled) {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                iconBtnNode.innerHTML = `<i class="fa-solid fa-sun text-amber-400"></i>`;
            } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                iconBtnNode.innerHTML = `<i class="fa-solid fa-moon"></i>`;
            }
        }

        function toggleAppTheme() {
            AppState.darkModeEnabled = !AppState.darkModeEnabled;
            localStorage.setItem('quran_theme', AppState.darkModeEnabled ? 'dark' : 'light');
            syncAppThemeInterfaceDisplay();
            if(AppState.activeNavigationTab === 'read') drawActiveSurahCanvasScreen();
        }

        async function downloadSurahIndexCatalog() {
            try {
                const response = await fetch(`${API_ENDPOINT_URL_ROOT}/surah`);
                const parsedResult = await response.json();
                if(parsedResult.code === 200) {
                    AppState.surahCacheIndexList = parsedResult.data;
                    renderSurahSidebarMenuComponent(AppState.surahCacheIndexList);
                } else { throw new Error(); }
            } catch(error) {
                renderErrorStateToScreenPanel("সূরা ইনডেক্স তালিকা লোড করা সম্ভব হয়নি। পেজটি রিফ্রেশ করুন।");
            }
        }

        function mapToBengaliNumeralString(digitString) {
            const digitsBengaliArray = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return digitString.toString().split('').map(character => digitsBengaliArray[character] || character).join('');
        }

        function renderSurahSidebarMenuComponent(surahDataArray) {
            const containerNode = document.getElementById('sidebarListWrapper');
            containerNode.innerHTML = '';

            if(surahDataArray.length === 0) {
                containerNode.innerHTML = `<p class="text-xs font-semibold text-[var(--text-muted)] text-center py-6 bangla-text">কোনো সূরা মেলেনি</p>`;
                return;
            }

            surahDataArray.forEach(surah => {
                const isCurrentActive = AppState.currentSurahContextObj && AppState.currentSurahContextObj.number === surah.number;
                const dynamicSelectionBorderClasses = isCurrentActive ? 'border-[var(--accent-gold)] bg-[var(--bg-elevated)] shadow-md' : 'border-[var(--border)] hover:bg-[var(--bg-elevated)]/30';

                const cardItemMarkup = `
                    <div onclick="fetchAndLoadSurahDataPackage(${surah.number})" class="bg-[var(--bg-card)] border p-3 rounded-xl flex items-center justify-between cursor-pointer transition duration-150 ease-out ${dynamicSelectionBorderClasses}">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold text-[var(--accent-gold)] bg-[var(--bg-deep)] w-7 h-7 rounded-lg flex items-center justify-center border border-[var(--border)] font-mono">${mapToBengaliNumeralString(surah.number)}</span>
                            <div>
                                <h4 class="text-xs font-bold text-[var(--text-primary)] tracking-wide">${surah.englishNameTranslation}</h4>
                                <p class="text-[10px] text-[var(--text-muted)] font-medium mt-0.5">${surah.englishName} • আয়াত ${mapToBengaliNumeralString(surah.numberOfAyahs)}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <h5 class="arabic-text text-base font-bold text-[var(--accent-gold)]">${surah.name}</h5>
                            <span class="inline-block text-[8px] px-1.5 py-0.5 rounded-md font-bold mt-1 ${surah.revelationType === 'Meccan' ? 'bg-amber-500/10 text-amber-500' : 'bg-emerald-500/10 text-emerald-500'}">${surah.revelationType === 'Meccan' ? 'মাক্কী' : 'মাদানী'}</span>
                        </div>
                    </div>
                `;
                containerNode.insertAdjacentHTML('beforeend', cardItemMarkup);
            });
        }

        function executeLiveSidebarSearch(queryTextValue) {
            AppState.searchFilterQueryString = queryTextValue.toLowerCase().trim();
            const filteredResults = AppState.surahCacheIndexList.filter(item => 
                item.englishName.toLowerCase().includes(AppState.searchFilterQueryString) ||
                item.englishNameTranslation.toLowerCase().includes(AppState.searchFilterQueryString) ||
                item.number.toString() === AppState.searchFilterQueryString
            );
            renderSurahSidebarMenuComponent(filteredResults);
        }

        function openResponsiveMobileSidebarTab() {
            document.getElementById('surahSidebarPanel').classList.remove('-translate-x-full');
            document.getElementById('responsiveSidebarBackdrop').classList.remove('hidden');
            switchMobileActiveTabIndicatorState('surah');
        }

        function closeResponsiveMobileSidebar() {
            document.getElementById('surahSidebarPanel').classList.add('-translate-x-full');
            document.getElementById('responsiveSidebarBackdrop').classList.add('hidden');
            switchMobileActiveTabIndicatorState(AppState.activeNavigationTab);
        }

        function navigateToReaderMainDashboard() {
            closeResponsiveMobileSidebar();
            AppState.activeNavigationTab = 'read';
            switchMobileActiveTabIndicatorState('read');
            if(AppState.currentSurahContextObj) drawActiveSurahCanvasScreen();
        }

        async function fetchAndLoadSurahDataPackage(surahNumberIdCode, targetVerseIndexOffset = 0) {
            closeResponsiveMobileSidebar();
            renderWorkspaceLoadingPlaceholderState();
            
            try {
                const [arabicDataResponse, bengaliTranslationResponse] = await Promise.all([
                    fetch(`${API_ENDPOINT_URL_ROOT}/surah/${surahNumberIdCode}/${AppState.activeReciterIdString}`),
                    fetch(`${API_ENDPOINT_URL_ROOT}/surah/${surahNumberIdCode}/bn.bengali`)
                ]);

                const parsedArabicJSON = await arabicDataResponse.json();
                const parsedBengaliJSON = await bengaliTranslationResponse.json();

                if(parsedArabicJSON.code === 200 && parsedBengaliJSON.code === 200) {
                    AppState.currentSurahContextObj = parsedArabicJSON.data;
                    
                    AppState.currentSurahContextObj.ayahs.forEach((verseItemNode, indexPointer) => {
                        verseItemNode.banglaTranslationStringText = parsedBengaliJSON.data.ayahs[indexPointer].text;
                    });

                    AppState.currentAyahActiveIndex = targetVerseIndexOffset;
                    AppState.activeNavigationTab = 'read';
                    
                    switchMobileActiveTabIndicatorState('read');
                    drawActiveSurahCanvasScreen();
                    refreshGlobalFooterAudioDeckMetadata();
                    
                    localStorage.setItem('quran_last_position', JSON.stringify({
                        surah: surahNumberIdCode,
                        ayahIndex: targetVerseIndexOffset
                    }));

                    renderSurahSidebarMenuComponent(AppState.surahCacheIndexList.filter(node => 
                        node.englishName.toLowerCase().includes(AppState.searchFilterQueryString) ||
                        node.englishNameTranslation.toLowerCase().includes(AppState.searchFilterQueryString)
                    ));

                } else { throw new Error(); }
            } catch(error) {

                settings: document.getElementById('tabItemSettings')

        function executeAutoScrollingAnimationToCenterView() {

            let targetNode = null;
            if(AppState.displayReadingMode === 'ayah') {
                targetNode = document.getElementById(`verse-card-block-${AppState.currentAyahActiveIndex}`);
            } else {

        // ---------------- High-Speed Audio Stream Management Core Architecture ----------------
        function setupCoreAudioEngineStateListeners() {
            coreAudioPlayer.addEventListener('timeupdate', () => {
                if(!coreAudioPlayer.duration) return;
                const ratioPercentage = (coreAudioPlayer.currentTime / coreAudioPlayer.duration) * 100;
                document.getElementById('playerTimelineProgressSlider').value = ratioPercentage;
                document.getElementById('playerTimerCurrentTime').innerText = convertSecondsToDisplayTimerDigits(coreAudioPlayer.currentTime);
            });

            coreAudioPlayer.addEventListener('loadedmetadata', () => {
                document.getElementById('playerTimerTotalDuration').innerText = convertSecondsToDisplayTimerDigits(coreAudioPlayer.duration);
            });

            coreAudioPlayer.addEventListener('ended', () => {
                if(AppState.isLoopingSingleVerse) {
                    coreAudioPlayer.currentTime = 0;
                    coreAudioPlayer.play().catch(() => {});
                } else {
                    playNextVerseTrack();
                }
            });

            coreAudioPlayer.addEventListener('error', () => {
                AppState.isPlaying = false;
                syncMasterPlayPauseButtonUI();
            });
        }

        function convertSecondsToDisplayTimerDigits(secondsData) {
            const totalMinutes = Math.floor(secondsData / 60).toString().padStart(2, '0');
            const totalSeconds = Math.floor(secondsData % 60).toString().padStart(2, '0');
            return `${totalMinutes}:${totalSeconds}`;
        }

        function refreshGlobalFooterAudioDeckMetadata() {
            if(!AppState.currentSurahContextObj) return;
            const surah = AppState.currentSurahContextObj;
            const currentVerse = surah.ayahs[AppState.currentAyahActiveIndex];

            document.getElementById('footerMetaSurahTitle').innerText = `সূরা ${surah.englishNameTranslation}`;
            document.getElementById('footerMetaAyahIndicator').innerText = `আয়াত: ${mapToBengaliNumeralString(currentVerse.numberInSurah)} / ${mapToBengaliNumeralString(surah.numberOfAyahs)}`;

            coreAudioPlayer.src = currentVerse.audio;
            coreAudioPlayer.playbackRate = AppState.playbackRateSpeedVelocity;
            coreAudioPlayer.volume = AppState.globalVolumeLevel;
        }

        function handleMasterPlaybackTrigger() {
            if(!AppState.currentSurahContextObj) return;
            if(AppState.isPlaying) {
                coreAudioPlayer.pause();
                AppState.isPlaying = false;
            } else {
                coreAudioPlayer.play().catch(() => {});
                AppState.isPlaying = true;
            }
            syncMasterPlayPauseButtonUI();
            executeHighSpeedTextHighlightUpdates();
        }

        function triggerTargetVerseAudioTrackPlayback(explicitVerseIndex) {
            if(AppState.currentAyahActiveIndex === explicitVerseIndex) {
                handleMasterPlaybackTrigger();
            } else {
                AppState.currentAyahActiveIndex = explicitVerseIndex;
                refreshGlobalFooterAudioDeckMetadata();
                AppState.isPlaying = true;
                coreAudioPlayer.play().catch(() => {});
                syncMasterPlayPauseButtonUI();
                executeHighSpeedTextHighlightUpdates();
                executeAutoScrollingAnimationToCenterView();
            }
        }

        function playNextVerseTrack() {
            if(!AppState.currentSurahContextObj) return;
            if(AppState.currentAyahActiveIndex < AppState.currentSurahContextObj.ayahs.length - 1) {
                AppState.currentAyahActiveIndex++;
                performTrackShiftExecutionPipeline();
            } else if(AppState.isLoopingWholeSurah) {
                AppState.currentAyahActiveIndex = 0;
                performTrackShiftExecutionPipeline();
            } else {
                if(AppState.currentSurahContextObj.number < 114) {
                    fetchAndLoadSurahDataPackage(AppState.currentSurahContextObj.number + 1, 0).then(() => {
                        handleMasterPlaybackTrigger();
                    });
                } else {
                    AppState.isPlaying = false;
                    syncMasterPlayPauseButtonUI();
                }
            }
        }

        function playPreviousVerseTrack() {
            if(!AppState.currentSurahContextObj) return;
            if(AppState.currentAyahActiveIndex > 0) {
                AppState.currentAyahActiveIndex--;
                performTrackShiftExecutionPipeline();
            }
        }

        function performTrackShiftExecutionPipeline() {
            refreshGlobalFooterAudioDeckMetadata();
            executeHighSpeedTextHighlightUpdates();
            executeAutoScrollingAnimationToCenterView();
            if(AppState.isPlaying) {
                coreAudioPlayer.play().catch(() => {});
            }
        }

        // High-Speed Dom Targeting Text Only Color Shift Highlight Processor Engine
        function executeHighSpeedTextHighlightUpdates() {
            if(AppState.activeNavigationTab !== 'read') return;

            if(AppState.displayReadingMode === 'ayah') {
                // High performance DOM attribute cleanups without heavy screen reflow cycles
                document.querySelectorAll('.active-text-arabic').forEach(node => node.classList.remove('active-text-arabic'));
                document.querySelectorAll('.active-text-bangla').forEach(node => node.classList.remove('active-text-bangla'));
                document.querySelectorAll('.active-octagon').forEach(node => node.classList.remove('active-octagon'));

                const targetArabicTextNode = document.getElementById(`arabic-text-render-node-${AppState.currentAyahActiveIndex}`);
                const targetBanglaTextNode = document.getElementById(`bangla-text-render-node-${AppState.currentAyahActiveIndex}`);
                const targetOctagonNode = document.getElementById(`octagon-badge-${AppState.currentAyahActiveIndex}`);

                if(targetArabicTextNode) targetArabicTextNode.classList.add('active-text-arabic');
                if(targetBanglaTextNode) targetBanglaTextNode.classList.add('active-text-bangla');
                if(targetOctagonNode) targetOctagonNode.classList.add('active-octagon');

                // Dynamic single icon switcher state updater loops mapping execution
                document.querySelectorAll('[id^="verse-card-block-"]').forEach((cardBlock, loopIndex) => {
                    const iconNode = cardBlock.querySelector('.fa-play, .fa-pause');
                    if(iconNode) {
                        if(loopIndex === AppState.currentAyahActiveIndex && AppState.isPlaying) {
                            iconNode.className = 'fa-solid fa-pause text-[var(--accent-emerald)]';
                        } else {
                            iconNode.className = 'fa-solid fa-play';
                        }
                    }
                });
            } else {
                document.querySelectorAll('.active-text-arabic').forEach(node => node.classList.remove('active-text-arabic', 'font-semibold'));
                document.querySelectorAll('.active-text-bangla').forEach(node => node.classList.remove('active-text-bangla'));

                const inlineSpanNode = document.getElementById(`inline-arabic-span-${AppState.currentAyahActiveIndex}`);
                const inlineParagraphNode = document.getElementById(`inline-bangla-paragraph-${AppState.currentAyahActiveIndex}`);

                if(inlineSpanNode) inlineSpanNode.classList.add('active-text-arabic', 'font-semibold');
                if(inlineParagraphNode) inlineParagraphNode.classList.add('active-text-bangla');
            }
        }

        function syncMasterPlayPauseButtonUI() {
            const masterBtnNode = document.getElementById('globalPlayPauseFloatingBtn');
            masterBtnNode.innerHTML = AppState.isPlaying ? `<i class="fa-solid fa-pause"></i>` : `<i class="fa-solid fa-play pl-0.5"></i>`;
        }

        function seekActiveAudioTimeline(sliderValue) {
            if(!coreAudioPlayer.duration) return;
            coreAudioPlayer.currentTime = (sliderValue / 100) * coreAudioPlayer.duration;
        }

        function changeAppVolumeIntensity(sliderValue) {
            AppState.globalVolumeLevel = sliderValue;
            coreAudioPlayer.volume = sliderValue;
            
            const volumeIconBadgeNode = document.getElementById('playerVolumeIconBadge');
            if(sliderValue == 0) volumeIconBadgeNode.innerHTML = `<i class="fa-solid fa-volume-xmark text-red-400"></i>`;
            else if(sliderValue < 0.5) volumeIconBadgeNode.innerHTML = `<i class="fa-solid fa-volume-low"></i>`;
            else volumeIconBadgeNode.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
        }

        function toggleAudioMuteState() {
            const sliderComponent = document.getElementById('playerVolumeControlSlider');
            if(coreAudioPlayer.volume > 0) {
                sliderComponent.value = 0;
                changeAppVolumeIntensity(0);
            } else {
                sliderComponent.value = 1;
                changeAppVolumeIntensity(1);
            }
        }

        function adjustAudioPlaybackVelocity(speedValue) {
            AppState.playbackRateSpeedVelocity = parseFloat(speedValue);
            coreAudioPlayer.playbackRate = AppState.playbackRateSpeedVelocity;
        }

        function toggleSingleVerseLoopOption() {
            AppState.isLoopingSingleVerse = !AppState.isLoopingSingleVerse;
            const buttonNode = document.getElementById('loopSingleVerseToggleBtn');
            if(AppState.isLoopingSingleVerse) {
                buttonNode.classList.add('text-[var(--accent-gold)]');
                if(AppState.isLoopingWholeSurah) toggleWholeSurahLoopOption();
            } else {
                buttonNode.classList.remove('text-[var(--accent-gold)]');
            }
        }

        function toggleWholeSurahLoopOption() {
            AppState.isLoopingWholeSurah = !AppState.isLoopingWholeSurah;
            const buttonNode = document.getElementById('loopWholeSurahToggleBtn');
            if(AppState.isLoopingWholeSurah) {
                buttonNode.classList.add('text-[var(--accent-gold)]');
                if(AppState.isLoopingSingleVerse) toggleSingleVerseLoopOption();
            } else {
                buttonNode.classList.remove('text-[var(--accent-gold)]');
            }
        }

        async function switchAppReciterContext(reciterIdStringValue) {
            AppState.activeReciterIdString = reciterIdStringValue;
            localStorage.setItem('quran_reciter', reciterIdStringValue);
            if(AppState.currentSurahContextObj) {
                await fetchAndLoadSurahDataPackage(AppState.currentSurahContextObj.number, AppState.currentAyahActiveIndex);
            }
        }

        function changeAppReadingMode(targetDisplayMode) {
            AppState.displayReadingMode = targetDisplayMode;
            const tabAyahNode = document.getElementById('modeTabAyah');
            const tabPageNode = document.getElementById('modeTabPage');

            if(targetDisplayMode === 'ayah') {
                tabAyahNode.className = 'px-3 py-1.5 rounded-md bg-[var(--bg-card)] text-[var(--accent-gold)] transition bangla-text cursor-pointer';
                tabPageNode.className = 'px-3 py-1.5 rounded-md text-[var(--text-muted)] transition bangla-text cursor-pointer';
            } else {
                tabPageNode.className = 'px-3 py-1.5 rounded-md bg-[var(--bg-card)] text-[var(--accent-gold)] transition bangla-text cursor-pointer';
                tabAyahNode.className = 'px-3 py-1.5 rounded-md text-[var(--text-muted)] transition bangla-text cursor-pointer';
            }

            if(AppState.currentSurahContextObj && AppState.activeNavigationTab === 'read') {
                drawActiveSurahCanvasScreen();
            }
        }

        // ---------------- Bookmarks Storage & Action Utilities Module ----------------
        function toggleVerseBookmarkPersistenceStorage(surahNo, ayahNo, surahTranslationName) {
            const indexMatch = AppState.userSavedBookmarksList.findIndex(record => record.surah === surahNo && record.ayah === ayahNo);

            if(indexMatch > -1) {
                AppState.userSavedBookmarksList.splice(indexMatch, 1);
            } else {
                AppState.userSavedBookmarksList.push({
                    surah: surahNo,
                    ayah: ayahNo,
                    surahName: surahTranslationName
                });
            }

            localStorage.setItem('quran_bookmarks', JSON.stringify(AppState.userSavedBookmarksList));
            
            if(AppState.activeNavigationTab === 'bookmark') {
                loadUserBookmarksDashboardPage();
            } else {
                drawActiveSurahCanvasScreen();
            }
        }

        function copyVerseDataToSystemClipboard(surahNo, ayahNo, localIndexOffset) {
            const verseNode = AppState.currentSurahContextObj.ayahs[localIndexOffset];
            const structuredStringData = `${verseNode.text}\n\n${verseNode.banglaTranslationStringText}\n(সূরা ${AppState.currentSurahContextObj.englishNameTranslation}: আয়াত ${mapToBengaliNumeralString(ayahNo)})`;
            
            navigator.clipboard.writeText(structuredStringData).then(() => {
                alert("আয়াত কপি সম্পন্ন হয়েছে!");
            }).catch(() => {});
        }

        function shareVerseContextViaWebAPI(surahNo, ayahNo, localIndexOffset) {
            const verseNode = AppState.currentSurahContextObj.ayahs[localIndexOffset];
            if(navigator.share) {
                navigator.share({
                    title: `সূরা ${AppState.currentSurahContextObj.englishNameTranslation}`,
                    text: `${verseNode.text}\n\n${verseNode.banglaTranslationStringText}\n(আয়াত: ${mapToBengaliNumeralString(ayahNo)})`
                }).catch(() => {});
            } else {
                copyVerseDataToSystemClipboard(surahNo, ayahNo, localIndexOffset);
            }
        }
    </script>
</body>
    </html>
