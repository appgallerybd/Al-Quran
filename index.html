<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>القرآن الكريم — আল-কুরআন প্রিমিয়াম</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #070b14;
            --bg-card: #0f1626;
            --bg-elevated: #172033;
            --accent-gold: #e5b869;
            --accent-gold-glow: rgba(229, 184, 105, 0.15);
            --accent-emerald: #10b981;
            --text-primary: #f3edd7;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --arabic-font: 'Amiri', serif;
            --bangla-font: 'Noto Sans Bengali', sans-serif;
            --ui-font: 'Inter', system-ui, sans-serif;
        }

        .light {
            --bg-deep: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --accent-gold: #b48528;
            --accent-gold-glow: rgba(180, 133, 40, 0.08);
            --accent-emerald: #059669;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--ui-font);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .bangla-text { font-family: var(--bangla-font); }
        .arabic-text { font-family: var(--arabic-font); direction: rtl; }

        /* Custom Premium Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

        /* Octagon Ayah Number Design */
        .ayah-octagon {
            width: 44px;
            height: 44px;
            background: var(--bg-elevated);
            border: 1.5px solid var(--accent-gold);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent-gold);
            box-shadow: 0 4px 12px var(--accent-gold-glow);
        }

        /* Active Card Glow styling */
        .ayah-card-active {
            border-color: var(--accent-gold) !important;
            background-color: var(--bg-elevated) !important;
            box-shadow: 0 0 20px var(--accent-gold-glow);
        }

        .shimmer {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite linear;
        }
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Mobile Safe Bottom Navigation Area padding */
        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 80px); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden antialiased">

    <header class="bg-[var(--bg-card)] border-b border-[var(--border)] px-4 py-3 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[var(--accent-gold)] to-amber-300 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-quran text-slate-900 text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-[var(--accent-gold)] arabic-text">القرآن الكريم</h1>
                <p class="text-[10px] text-[var(--text-muted)] bangla-text -mt-1 font-medium tracking-tight">আল-কুরআন প্রিমিয়াম</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-[var(--bg-elevated)] border border-[var(--border)] flex items-center justify-center text-[var(--accent-gold)] hover:scale-105 active:scale-95 transition cursor-pointer" id="themeToggler">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <aside id="surahSidebar" class="bg-[var(--bg-card)] border-r border-[var(--border)] w-full md:w-[320px] flex flex-col absolute md:relative inset-y-0 left-0 z-40 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            <div class="p-4 border-b border-[var(--border)]">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-xs text-[var(--text-muted)]"></i>
                    <input type="text" id="surahSearch" placeholder="সূরার নাম খুঁজুন (বাংলা / English)..." class="w-full pl-9 pr-4 py-2.5 bg-[var(--bg-deep)] border border-[var(--border)] rounded-xl text-xs text-[var(--text-primary)] focus:outline-none focus:border-[var(--accent-gold)] bangla-text" oninput="filterSurahSearch(this.value)">
                </div>
            </div>

            <div id="surahListElement" class="flex-1 overflow-y-auto p-2 space-y-1.5 pb-24 md:pb-4">
                <div class="shimmer h-14 rounded-xl w-full opacity-20"></div>
                <div class="shimmer h-14 rounded-xl w-full opacity-20"></div>
                <div class="shimmer h-14 rounded-xl w-full opacity-20"></div>
            </div>
        </aside>

        <div id="sidebarBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden md:hidden" onclick="closeMobileSidebar()"></div>

        <main class="flex-1 flex flex-col overflow-hidden bg-[var(--bg-deep)]">
            
            <section class="bg-[var(--bg-card)] border-b border-[var(--border)] px-4 py-3 flex flex-wrap gap-3 items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <span class="text-[11px] text-[var(--text-muted)] font-medium bangla-text"><i class="fa-solid fa-headset text-[var(--accent-gold)] mr-1"></i> কারী:</span>
                    <select id="reciterSelector" class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-lg px-2 py-1 text-xs text-[var(--accent-gold)] font-medium focus:outline-none bangla-text cursor-pointer" onchange="changeReciterProfile(this.value)">
                        <option value="ar.alafasy">মিশারি রাশিদ আল-আফাসি</option>
                        <option value="ar.abdurrahmaansudais">আব্দুর রহমান আস-সুদাইস</option>
                        <option value="ar.husary">মাহমুদ খলিল আল-হুসারি</option>
                        <option value="ar.minshawi">মুহাম্মদ সিদ্দিক আল-মিনশাওয়ি</option>
                        <option value="ar.muhammadayyoub">মুহাম্মদ আইয়ুব</option>
                    </select>
                </div>

                <div class="flex bg-[var(--bg-deep)] border border-[var(--border)] rounded-lg p-0.5 text-xs font-semibold">
                    <button id="viewModeAyah" onclick="updateViewMode('ayah')" class="px-3 py-1.5 rounded-md bg-[var(--bg-card)] text-[var(--accent-gold)] transition bangla-text cursor-pointer">আয়াত মোড</button>
                    <button id="viewModePage" onclick="updateViewMode('page')" class="px-3 py-1.5 rounded-md text-[var(--text-muted)] transition bangla-text cursor-pointer">পেইজ মোড</button>
                </div>
            </section>

            <section id="mainCoreViewer" class="flex-1 overflow-y-auto p-4 md:p-6 safe-bottom">
                <div class="flex flex-col items-center justify-center py-32 text-[var(--text-muted)]">
                    <i class="fa-solid fa-spinner animate-spin text-3xl text-[var(--accent-gold)] mb-4"></i>
                    <p class="text-xs bangla-text font-medium">পবিত্র কুরআনুল কারীমের আয়াতসমূহ লোড হচ্ছে...</p>
                </div>
            </section>
        </main>
    </div>

    <footer class="bg-[var(--bg-card)] border-t border-[var(--border)] p-3 md:px-6 z-40 shadow-2xl relative shrink-0">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-3">
            
            <div class="w-full md:w-1/4 text-center md:text-left flex flex-col justify-center">
                <h4 id="audioMetaSurahName" class="text-sm font-bold text-[var(--accent-gold)] bangla-text">সূরা আল-ফাতিহা</h4>
                <p id="audioMetaAyahIndex" class="text-[10px] text-[var(--text-muted)] bangla-text font-medium mt-0.5">আয়াত: ১ / ৭</p>
            </div>

            <div class="flex-1 w-full flex flex-col items-center gap-1">
                <div class="flex items-center gap-6">
                    <button onclick="toggleSingleVerseLoop()" id="loopVerseIconBtn" class="text-[var(--text-muted)] hover:text-[var(--accent-gold)] transition text-xs flex flex-col items-center cursor-pointer" title="আয়াত লুপ">
                        <i class="fa-solid fa-arrows-spin text-base"></i>
                        <span class="text-[8px] font-bold -mt-0.5">Verse</span>
                    </button>
                    
                    <button onclick="triggerPreviousAyah()" class="text-[var(--accent-gold)] text-base hover:scale-110 active:scale-95 transition cursor-pointer" title="আগের আয়াত">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    
                    <button onclick="handleGlobalPlayPauseState()" id="globalMasterPlayTrigger" class="w-12 h-12 rounded-full bg-gradient-to-tr from-[var(--accent-gold)] to-amber-400 text-slate-950 text-base flex items-center justify-center shadow-lg active:scale-90 hover:brightness-110 transition cursor-pointer" title="প্লে/পজ">
                        <i class="fa-solid fa-play pl-0.5"></i>
                    </button>
                    
                    <button onclick="triggerNextAyah()" class="text-[var(--accent-gold)] text-base hover:scale-110 active:scale-95 transition cursor-pointer" title="পরের আয়াত">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>

                    <button onclick="toggleWholeSurahLoop()" id="loopSurahIconBtn" class="text-[var(--text-muted)] hover:text-[var(--accent-gold)] transition text-xs flex flex-col items-center cursor-pointer" title="সূরা লুপ">
                        <i class="fa-solid fa-rotate text-base"></i>
                        <span class="text-[8px] font-bold -mt-0.5">Surah</span>
                    </button>
                </div>

                <div class="w-full flex items-center gap-2.5 text-[10px] text-[var(--text-muted)] font-mono">
                    <span id="playerCurrentTimeLabel">00:00</span>
                    <input type="range" id="playerProgressBarSlider" value="0" min="0" max="100" class="flex-1 h-1 bg-[var(--bg-deep)] rounded-lg appearance-none cursor-pointer accent-[var(--accent-emerald)]" oninput="handleAudioTimelineSeeking(this.value)">
                    <span id="playerTotalDurationLabel">00:00</span>
                </div>
            </div>

            <div class="hidden md:flex w-full md:w-1/4 items-center justify-end gap-4 text-xs">
                <div class="flex items-center gap-1.5 bg-[var(--bg-deep)] border border-[var(--border)] px-2 py-1 rounded-lg">
                    <i class="fa-solid fa-gauge-high text-[var(--text-muted)] text-[10px]"></i>
                    <select id="playerSpeedMenu" onchange="updatePlayerSpeedRate(this.value)" class="bg-transparent border-none font-medium text-[var(--text-muted)] text-[10px] focus:outline-none cursor-pointer">
                        <option value="0.75">0.75x</option>
                        <option value="1.0" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <button onclick="handleAudioMuteToggling()" id="playerVolumeStateIcon" class="text-[var(--text-muted)] hover:text-[var(--accent-gold)] transition cursor-pointer">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" id="playerVolumeSlider" min="0" max="1" step="0.1" value="1" class="w-16 h-1 accent-[var(--accent-gold)] bg-[var(--bg-deep)] rounded-lg appearance-none cursor-pointer" oninput="updateAudioVolumeLevel(this.value)">
                </div>
            </div>

        </div>
    </footer>

    <nav class="md:hidden fixed bottom-0 inset-x-0 bg-[var(--bg-card)]/90 backdrop-blur-md border-t border-[var(--border)] h-16 flex items-center justify-around px-2 z-50 shadow-xl pb-safe">
        <button onclick="openMobileSidebarTab()" id="navTabSurah" class="flex flex-col items-center text-[var(--accent-gold)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-list-ul text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">সূরাসমূহ</span>
        </button>
        <button onclick="switchToMainReaderTab()" id="navTabRead" class="flex flex-col items-center text-[var(--text-muted)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-book-open text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">তিলাওয়াত</span>
        </button>
        <button onclick="renderUserBookmarksDashboard()" id="navTabBookmark" class="flex flex-col items-center text-[var(--text-muted)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-bookmark text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">বুকমার্ক</span>
        </button>
        <button onclick="openCustomSettingsViewPage()" id="navTabSettings" class="flex flex-col items-center text-[var(--text-muted)] transition gap-0.5 min-w-[50px] cursor-pointer">
            <i class="fa-solid fa-sliders text-lg"></i>
            <span class="text-[9px] font-bold bangla-text">সেটিংস</span>
        </button>
    </nav>

    <audio id="nativeAudioElement" preload="auto"></audio>

    <script>
        // Central Application Core Repository Global Reactive Management State
        const GlobalAppState = {
            surahCacheList: [],
            currentActiveSurah: null,
            currentAyahPointerIndex: 0,
            activeReciterEdition: 'ar.alafasy',
            isPlayingState: false,
            isLoopingSingleVerse: false,
            isLoopingWholeSurah: false,
            audioVolumeLevel: 1.0,
            audioSpeedPlaybackRate: 1.0,
            userSavedBookmarks: [],
            darkModeActive: true,
            displayReadingMode: 'ayah', // 'ayah' | 'page'
            activeDashboardViewTab: 'read', // 'surah' | 'read' | 'bookmark' | 'settings'
            searchFilterString: '',
            arabicTextFontSize: '2.4rem'
        };

        const nativeAudio = document.getElementById('nativeAudioElement');
        const API_SERVER_ROOT = 'https://api.alquran.cloud/v1';

        // Bootstrapping Entry Hook Initializer Configuration Listener
        window.addEventListener('DOMContentLoaded', async () => {
            loadSavedPersistenceConfigurationData();
            initializeSystemAudioListeners();
            syncDisplayThemeUI();
            
            // Dynamic initial data processing call loads
            await requestSurahDataList();
            
            const lastTrackedLocation = JSON.parse(localStorage.getItem('quran_last_position')) || { surah: 1, ayahIndex: 0 };
            await loadSelectedSurahContext(lastTrackedLocation.surah, lastTrackedLocation.ayahIndex);
            
            updateNavigationActiveTabUI('read');
        });

        // Parse state parameters inside local browser device profiles storage
        function loadSavedPersistenceConfigurationData() {
            GlobalAppState.userSavedBookmarks = JSON.parse(localStorage.getItem('quran_bookmarks')) || [];
            GlobalAppState.activeReciterEdition = localStorage.getItem('quran_reciter') || 'ar.alafasy';
            document.getElementById('reciterSelector').value = GlobalAppState.activeReciterEdition;
            GlobalAppState.darkModeActive = localStorage.getItem('quran_theme') !== 'light';
            GlobalAppState.arabicTextFontSize = localStorage.getItem('quran_font_size') || '2.4rem';
        }

        // Apply dark/light core configuration classes
        function syncDisplayThemeUI() {
            const documentElementClass = document.documentElement.classList;
            const togglerIconNode = document.getElementById('themeToggler');
            if(GlobalAppState.darkModeActive) {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                togglerIconNode.innerHTML = `<i class="fa-solid fa-sun text-amber-400"></i>`;
            } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                togglerIconNode.innerHTML = `<i class="fa-solid fa-moon"></i>`;
            }
        }

        function toggleTheme() {
            GlobalAppState.darkModeActive = !GlobalAppState.darkModeActive;
            localStorage.setItem('quran_theme', GlobalAppState.darkModeActive ? 'dark' : 'light');
            syncDisplayThemeUI();
            if(!GlobalAppState.currentActiveSurah && GlobalAppState.activeDashboardViewTab === 'read') return;
            if(GlobalAppState.activeDashboardViewTab === 'read') drawSurahViewerCanvas();
        }

        // Fetch complete index listing array for 114 Surahs from Endpoint API
        async function requestSurahDataList() {
            try {
                const networkResponse = await fetch(`${API_SERVER_ROOT}/surah`);
                const parsedJSONData = await networkResponse.json();
                if(parsedJSONData.code === 200) {
                    GlobalAppState.surahCacheList = parsedJSONData.data;
                    renderSurahSelectionSidebar(GlobalAppState.surahCacheList);
                } else { throw new Error(); }
            } catch(errorLogs) {
                renderErrorStateDisplay("পবিত্র কুরআনের সূরা তালিকা লোড করা যায়নি। অনুগ্রহ করে পেজটি রিফ্রেশ করুন।");
            }
        }

        // Convert standard counter digits strings to localized Bengali character values mapping
        function parseToBenglaNumeral(digitInput) {
            const localizedDigitsMap = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return digitInput.toString().split('').map(char => localizedDigitsMap[char] || char).join('');
        }

        // Render Sidebar Elements items index view panel list components markup mapping loops
        function renderSurahSelectionSidebar(surahArray) {
            const listTargetWrapperNode = document.getElementById('surahListElement');
            listTargetWrapperNode.innerHTML = '';

            if(surahArray.length === 0) {
                listTargetWrapperNode.innerHTML = `<p class="text-xs font-semibold text-[var(--text-muted)] text-center py-6 bangla-text">কোনো সূরা পাওয়া যায়নি</p>`;
                return;
            }

            surahArray.forEach(surahItem => {
                const isSelectedActiveSurah = GlobalAppState.currentActiveSurah && GlobalAppState.currentActiveSurah.number === surahItem.number;
                const dynamicStatusClasses = isSelectedActiveSurah ? 'border-[var(--accent-gold)] bg-[var(--bg-elevated)] shadow-md' : 'border-[var(--border)] hover:bg-[var(--bg-elevated)]/30';

                const customItemBlockMarkup = `
                    <div onclick="loadSelectedSurahContext(${surahItem.number})" class="bg-[var(--bg-card)] border p-3 rounded-xl flex items-center justify-between cursor-pointer transition duration-200 ease-out ${dynamicStatusClasses}">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold text-[var(--accent-gold)] bg-[var(--bg-deep)] w-7 h-7 rounded-lg flex items-center justify-center border border-[var(--border)] font-mono">${parseToBenglaNumeral(surahItem.number)}</span>
                            <div>
                                <h4 class="text-xs font-bold text-[var(--text-primary)] tracking-wide">${surahItem.englishNameTranslation}</h4>
                                <p class="text-[10px] text-[var(--text-muted)] font-medium mt-0.5">${surahItem.englishName} • আয়াত ${parseToBenglaNumeral(surahItem.numberOfAyahs)}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <h5 class="arabic-text text-base font-bold text-[var(--accent-gold)]">${surahItem.name}</h5>
                            <span class="inline-block text-[8px] px-1.5 py-0.5 rounded-md font-bold mt-1 ${surahItem.revelationType === 'Meccan' ? 'bg-amber-500/10 text-amber-500' : 'bg-emerald-500/10 text-emerald-500'}">${surahItem.revelationType === 'Meccan' ? 'মাক্কী' : 'মাদানী'}</span>
                        </div>
                    </div>
                `;
                listTargetWrapperNode.insertAdjacentHTML('beforeend', customItemBlockMarkup);
            });
        }

        // Live text filters search indexing engine mapping layer logic execution function
        function filterSurahSearch(searchQueryString) {
            GlobalAppState.searchFilterString = searchQueryString.toLowerCase().trim();
            const filteredArrayResults = GlobalAppState.surahCacheList.filter(surahNode => 
                surahNode.englishName.toLowerCase().includes(GlobalAppState.searchFilterString) ||
                surahNode.englishNameTranslation.toLowerCase().includes(GlobalAppState.searchFilterString) ||
                surahNode.number.toString() === GlobalAppState.searchFilterString
            );
            renderSurahSelectionSidebar(filteredArrayResults);
        }

        // Layout control responsive handlers for managing mobile views drawer animations switches
        function openMobileSidebarTab() {
            document.getElementById('surahSidebar').classList.remove('-translate-x-full');
            document.getElementById('sidebarBackdrop').classList.remove('hidden');
            updateNavigationActiveTabUI('surah');
        }

        function closeMobileSidebar() {
            document.getElementById('surahSidebar').classList.add('-translate-x-full');
            document.getElementById('sidebarBackdrop').classList.add('hidden');
            updateNavigationActiveTabUI(GlobalAppState.activeDashboardViewTab);
        }

        function switchToMainReaderTab() {
            closeMobileSidebar();
            GlobalAppState.activeDashboardViewTab = 'read';
            updateNavigationActiveTabUI('read');
            if(GlobalAppState.currentActiveSurah) drawSurahViewerCanvas();
        }

        // Main entry query fetch processor orchestrates download pipelines mapping data layers
        async function loadSelectedSurahContext(surahIdentifierID, explicitAyahIndexOffset = 0) {
            closeMobileSidebar();
            renderLoadingStateDisplay();
            
            try {
                const [arabicAudioStreamResponse, banglaTranslationResponse] = await Promise.all([
                    fetch(`${API_SERVER_ROOT}/surah/${surahIdentifierID}/${GlobalAppState.activeReciterEdition}`),
                    fetch(`${API_SERVER_ROOT}/surah/${surahIdentifierID}/bn.bengali`)
                ]);

                const formattedArabicJSON = await arabicAudioStreamResponse.json();
                const formattedBanglaJSON = await banglaTranslationResponse.json();

                if(formattedArabicJSON.code === 200 && formattedBanglaJSON.code === 200) {
                    GlobalAppState.currentActiveSurah = formattedArabicJSON.data;
                    
                    // Injection mapping loops structural parameters context
                    GlobalAppState.currentActiveSurah.ayahs.forEach((ayahNode, loopIndex) => {
                        ayahNode.banglaTranslationText = formattedBanglaJSON.data.ayahs[loopIndex].text;
                    });

                    GlobalAppState.currentAyahPointerIndex = explicitAyahIndexOffset;
                    GlobalAppState.activeDashboardViewTab = 'read';
                    
                    updateNavigationActiveTabUI('read');
                    drawSurahViewerCanvas();
                    refreshGlobalPlayerMetadataDisplayCard();
                    
                    // Persistent location tracking save step

        // Active State bottom application strip class switcher styler management engine module function
        function updateNavigationActiveTabUI(selectedTabID) {
            const tabButtonsMap = {
                surah: document.getElementById('navTabSurah'),
                read: document.getElementById('navTabRead'),
                bookmark: document.getElementById('navTabBookmark'),
                settings: document.getElementById('navTabSettings')
            };

            Object.keys(tabButtonsMap).forEach(key => {
                const node = tabButtonsMap[key];
                if(!node) return;
                if(key === selectedTabID) {
                    node.classList.add('text-[var(--accent-gold)]');
                    node.classList.remove('text-[var(--text-muted)]');
                } else {
                    node.classList.remove('text-[var(--accent-gold)]');
                    node.classList.add('text-[var(--text-muted)]');
                }
            });
        }

        // Scroll adjustments utility module algorithms execution step
        function executeAutoCenterScrollAnimation() {
            if(GlobalAppState.activeDashboardViewTab !== 'read') return;
            
            if(GlobalAppState.displayReadingMode === 'ayah') {
                constTargetNodeElement = document.getElementById(`verse-card-node-${GlobalAppState.currentAyahPointerIndex}`);
                if(constTargetNodeElement) {
                    constTargetNodeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                constTargetNodeElement = document.getElementById(`inline-text-pointer-${GlobalAppState.currentAyahPointerIndex}`);
                if(constTargetNodeElement) {
                    constTargetNodeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // ---------------- Audio Code Processing Architecture Engines ----------------
        function initializeSystemAudioListeners() {
            nativeAudio.addEventListener('timeupdate', () => {
                if(!nativeAudio.duration) return;
                const calculatedPercentage = (nativeAudio.currentTime / nativeAudio.duration) * 100;
                document.getElementById('playerProgressBarSlider').value = calculatedPercentage;
                document.getElementById('playerCurrentTimeLabel').innerText = formatSecondsToTimerString(nativeAudio.currentTime);
            });

            nativeAudio.addEventListener('loadedmetadata', () => {
                document.getElementById('playerTotalDurationLabel').innerText = formatSecondsToTimerString(nativeAudio.duration);
            });

            nativeAudio.addEventListener('ended', () => {
                if(GlobalAppState.isLoopingSingleVerse) {
                    nativeAudio.currentTime = 0;
                    nativeAudio.play().catch(() => {});
                } else {
                    triggerNextAyah();
                }
            });

            nativeAudio.addEventListener('error', () => {
                GlobalAppState.isPlayingState = false;
                syncGlobalPlayerMasterButtonUI();
            });
        }

        function formatSecondsToTimerString(secondsInputData) {
            const minutesBuffer = Math.floor(secondsInputData / 60).toString().padStart(2, '0');
            const secondsBuffer = Math.floor(secondsInputData % 60).toString().padStart(2, '0');
            return `${minutesBuffer}:${secondsBuffer}`;
        }

        function refreshGlobalPlayerMetadataDisplayCard() {
            if(!GlobalAppState.currentActiveSurah) return;
            const surahContext = GlobalAppState.currentActiveSurah;
            const currentVerseDataNode = surahContext.ayahs[GlobalAppState.currentAyahPointerIndex];

            document.getElementById('audioMetaSurahName').innerText = `সূরা ${surahContext.englishNameTranslation}`;
            document.getElementById('audioMetaAyahIndex').innerText = `আয়াত: ${parseToBenglaNumeral(currentVerseDataNode.numberInSurah)} / ${parseToBenglaNumeral(surahContext.numberOfAyahs)}`;

            nativeAudio.src = currentVerseDataNode.audio;
            nativeAudio.playbackRate = GlobalAppState.audioSpeedPlaybackRate;
            nativeAudio.volume = GlobalAppState.audioVolumeLevel;
        }

        function handleGlobalPlayPauseState() {
            if(!GlobalAppState.currentActiveSurah) return;
            if(GlobalAppState.isPlayingState) {
                nativeAudio.pause();
                GlobalAppState.isPlayingState = false;
            } else {
                nativeAudio.play().catch(() => {});
                GlobalAppState.isPlayingState = true;
            }
            syncGlobalPlayerMasterButtonUI();
            repaintWorkspaceVerseHighlights();
        }

        function triggerTargetVersePlayAudio(explicitVerseIndexOffset) {
            if(GlobalAppState.currentAyahPointerIndex === explicitVerseIndexOffset) {
                handleGlobalPlayPauseState();
            } else {
                GlobalAppState.currentAyahPointerIndex = explicitVerseIndexOffset;
                refreshGlobalPlayerMetadataDisplayCard();
                GlobalAppState.isPlayingState = true;
                nativeAudio.play().catch(() => {});
                syncGlobalPlayerMasterButtonUI();
                repaintWorkspaceVerseHighlights();
                executeAutoCenterScrollAnimation();
            }
        }

        function triggerNextAyah() {
            if(!GlobalAppState.currentActiveSurah) return;
            if(GlobalAppState.currentAyahPointerIndex < GlobalAppState.currentActiveSurah.ayahs.length - 1) {
                GlobalAppState.currentAyahPointerIndex++;
                performAudioTrackShiftSequence();
            } else if(GlobalAppState.isLoopingWholeSurah) {
                GlobalAppState.currentAyahPointerIndex = 0;
                performAudioTrackShiftSequence();
            } else {
                // Multi-surah bridge traversal engine module integration step boundary
                if(GlobalAppState.currentActiveSurah.number < 114) {
                    loadSelectedSurahContext(GlobalAppState.currentActiveSurah.number + 1, 0).then(() => {
                        handleGlobalPlayPauseState();
                    });
                } else {
                    GlobalAppState.isPlayingState = false;
                    syncGlobalPlayerMasterButtonUI();
                }
            }
        }

        function triggerPreviousAyah() {
            if(!GlobalAppState.currentActiveSurah) return;
            if(GlobalAppState.currentAyahPointerIndex > 0) {
                GlobalAppState.currentAyahPointerIndex--;
                performAudioTrackShiftSequence();
            }
        }

        function performAudioTrackShiftSequence() {
            refreshGlobalPlayerMetadataDisplayCard();
            repaintWorkspaceVerseHighlights();
            executeAutoCenterScrollAnimation();
            if(GlobalAppState.isPlayingState) {
                nativeAudio.play().catch(() => {});
            }
        }

        function repaintWorkspaceVerseHighlights() {
            if(GlobalAppState.activeDashboardViewTab !== 'read') return;
            
            if(GlobalAppState.displayReadingMode === 'ayah') {
                document.querySelectorAll('.ayah-card-active').forEach(node => node.classList.remove('ayah-card-active'));
                
                const currentCardContainerNode = document.getElementById(`verse-card-node-${GlobalAppState.currentAyahPointerIndex}`);
                if(currentCardContainerNode) currentCardContainerNode.classList.add('ayah-card-active');

                // Dynamic icon switcher mapping configuration step
                document.querySelectorAll('[id^="verse-card-node-"]').forEach((cardNode, index) => {
                    const iconElementNode = cardNode.querySelector('.fa-play, .fa-pause');
                    if(iconElementNode) {
                        if(index === GlobalAppState.currentAyahPointerIndex && GlobalAppState.isPlayingState) {
                            iconElementNode.className = 'fa-solid fa-pause text-[var(--accent-emerald)]';
                        } else {
                            iconElementNode.className = 'fa-solid fa-play';
                        }
                    }
                });
            } else {
                drawSurahViewerCanvas();
            }
        }

        function syncGlobalPlayerMasterButtonUI() {
            const playTriggerButtonIconNode = document.getElementById('globalMasterPlayTrigger');
            playTriggerButtonIconNode.innerHTML = GlobalAppState.isPlayingState ? `<i class="fa-solid fa-pause"></i>` : `<i class="fa-solid fa-play pl-0.5"></i>`;
        }

        function handleAudioTimelineSeeking(sliderValueData) {
            if(!nativeAudio.duration) return;
            nativeAudio.currentTime = (sliderValueData / 100) * nativeAudio.duration;
        }

        function updateAudioVolumeLevel(volumeValueSliderInput) {
            GlobalAppState.audioVolumeLevel = volumeValueSliderInput;
            nativeAudio.volume = volumeValueSliderInput;
            
            const volumeIconNode = document.getElementById('playerVolumeStateIcon');
            if(volumeValueSliderInput == 0) volumeIconNode.innerHTML = `<i class="fa-solid fa-volume-xmark text-red-400"></i>`;
            else if(volumeValueSliderInput < 0.5) volumeIconNode.innerHTML = `<i class="fa-solid fa-volume-low"></i>`;
            else volumeIconNode.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
        }

        function handleAudioMuteToggling() {
            const volumeSliderElementNode = document.getElementById('playerVolumeSlider');
            if(nativeAudio.volume > 0) {
                volumeSliderElementNode.value = 0;
                updateAudioVolumeLevel(0);
            } else {
                volumeSliderElementNode.value = 1;
                updateAudioVolumeLevel(1);
            }
        }

        function updatePlayerSpeedRate(speedSelectionValue) {
            GlobalAppState.audioSpeedPlaybackRate = parseFloat(speedSelectionValue);
            nativeAudio.playbackRate = GlobalAppState.audioSpeedPlaybackRate;
        }

        function toggleSingleVerseLoop() {
            GlobalAppState.isLoopingSingleVerse = !GlobalAppState.isLoopingSingleVerse;
            const buttonNode = document.getElementById('loopVerseIconBtn');
            if(GlobalAppState.isLoopingSingleVerse) {
                buttonNode.classList.add('text-[var(--accent-gold)]');
                if(GlobalAppState.isLoopingWholeSurah) toggleWholeSurahLoop();
            } else {
                buttonNode.classList.remove('text-[var(--accent-gold)]');
            }
        }

        function toggleWholeSurahLoop() {
            GlobalAppState.isLoopingWholeSurah = !GlobalAppState.isLoopingWholeSurah;
            const buttonNode = document.getElementById('loopSurahIconBtn');
            if(GlobalAppState.isLoopingWholeSurah) {
                buttonNode.classList.add('text-[var(--accent-gold)]');
                if(GlobalAppState.isLoopingSingleVerse) toggleSingleVerseLoop();
            } else {
                buttonNode.classList.remove('text-[var(--accent-gold)]');
            }
        }

        async function changeReciterProfile(reciterSelectedStringValue) {
            GlobalAppState.activeReciterEdition = reciterSelectedStringValue;
            localStorage.setItem('quran_reciter', reciterSelectedStringValue);
            if(GlobalAppState.currentActiveSurah) {
                await loadSelectedSurahContext(GlobalAppState.currentActiveSurah.number, GlobalAppState.currentAyahPointerIndex);
            }
        }

        function updateViewMode(targetModeString) {
            GlobalAppState.displayReadingMode = targetModeString;
            const viewModeAyahButtonNode = document.getElementById('viewModeAyah');
            const viewModePageButtonNode = document.getElementById('viewModePage');

            if(targetModeString === 'ayah') {
                viewModeAyahButtonNode.className = 'px-3 py-1.5 rounded-md bg-[var(--bg-card)] text-[var(--accent-gold)] transition bangla-text cursor-pointer';
                viewModePageButtonNode.className = 'px-3 py-1.5 rounded-md text-[var(--text-muted)] transition bangla-text cursor-pointer';
            } else {
                viewModePageButtonNode.className = 'px-3 py-1.5 rounded-md bg-[var(--bg-card)] text-[var(--accent-gold)] transition bangla-text cursor-pointer';
                viewModeAyahButtonNode.className = 'px-3 py-1.5 rounded-md text-[var(--text-muted)] transition bangla-text cursor-pointer';
            }

            if(GlobalAppState.currentActiveSurah && GlobalAppState.activeDashboardViewTab === 'read') {
                drawSurahViewerCanvas();
            }
        }

        // ---------------- Persistent Bookmark & Clipboard Module Utilities ----------------
        function toggleVerseBookmarkPersistence(surahNumberID, ayahNumberID, surahNameTranslationString) {
            const existingRecordIndex = GlobalAppState.userSavedBookmarks.findIndex(item => item.surah === surahNumberID && item.ayah === ayahNumberID);

            if(existingRecordIndex > -1) {
                GlobalAppState.userSavedBookmarks.splice(existingRecordIndex, 1);
            } else {
                GlobalAppState.userSavedBookmarks.push({
                    surah: surahNumberID,
                    ayah: ayahNumberID,
                    surahName: surahNameTranslationString
                });
            }

            localStorage.setItem('quran_bookmarks', JSON.stringify(GlobalAppState.userSavedBookmarks));
            
            if(GlobalAppState.activeDashboardViewTab === 'bookmark') {
                renderUserBookmarksDashboard();
            } else {
                drawSurahViewerCanvas();
            }
        }

        function copyVerseToClipboardData(surahNumberID, ayahNumberID, localVerseIndexOffset) {
            const targetAyahNodeContext = GlobalAppState.currentActiveSurah.ayahs[localVerseIndexOffset];
            const parsedStringPackage = `${targetAyahNodeContext.text}\n\n${targetAyahNodeContext.banglaTranslationText}\n(সূরা ${GlobalAppState.currentActiveSurah.englishNameTranslation}: আয়াত ${parseToBenglaNumeral(ayahNumberID)})`;
            
            navigator.clipboard.writeText(parsedStringPackage).then(() => {
                alert("আয়াত সফলভাবে কপি হয়েছে!");
            }).catch(() => {});
        }

        function shareVerseNativeWebShareAPI(surahNumberID, ayahNumberID, localVerseIndexOffset) {
            const targetAyahNodeContext = GlobalAppState.currentActiveSurah.ayahs[localVerseIndexOffset];
            if(navigator.share) {
                navigator.share({
                    title: `সূরা ${GlobalAppState.currentActiveSurah.englishNameTranslation}`,
                    text: `${targetAyahNodeContext.text}\n\n${targetAyahNodeContext.banglaTranslationText}\n(আয়াত: ${parseToBenglaNumeral(ayahNumberID)})`
                }).catch(() => {});
            } else {
                copyVerseToClipboardData(surahNumberID, ayahNumberID, localVerseIndexOffset);
            }
        }
    </script>
</body>
    </html>
